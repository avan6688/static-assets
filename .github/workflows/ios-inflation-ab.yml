name: ios-inflation-ab
on:
  workflow_dispatch: {}
jobs:
  ios-sim-safari:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment / runtimes
        run: |
          xcodebuild -version || true
          which safaridriver || true
          xcrun simctl list runtimes | grep -i ios || true
          xcrun simctl list devices available | grep -i iphone || true

      - name: Pick + boot an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json,sys
          j=json.load(sys.stdin)["devices"]
          best=None
          for rt,devs in j.items():
              if "iOS" not in rt: continue
              for d in devs:
                  if d["name"].startswith("iPhone"):
                      best=(d["udid"],d["name"],rt)
          print(best[0])
          import sys as s
          s.stderr.write("PICKED %s %s\n"%(best[1],best[2]))
          ')
          echo "PICKED udid=$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true

      - name: Enable safaridriver + install selenium
        run: |
          sudo safaridriver --enable || true
          pip3 install --quiet --break-system-packages selenium || pip3 install --quiet selenium
          python3 -c "import selenium; print('selenium', selenium.__version__)"

      - name: Serve page + run Safari (iOS Simulator) A/B inflation test
        shell: bash
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set +e
          echo "safaridriver version:"; safaridriver --version || true
          # 后台服务与 selenium 必须同一 step（跨 step 后台进程会被杀）
          cd "$GITHUB_WORKSPACE"
          nohup python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          # readiness loop（最多 ~30s）
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 http://127.0.0.1:8000/inflation-ab.html)
            echo "probe $i http_code=$code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 1
          done
          echo "---- http.log ----"; cat /tmp/http.log || true
          if [ "$ok" != "1" ]; then echo "HTTP server not ready, aborting"; exit 1; fi

          python3 - <<'PY'
          import time, json, os, sys
          from selenium import webdriver
          from selenium.webdriver.safari.options import Options

          udid=os.environ["SIM_UDID"]
          opts=Options()
          # ---- 指向 iOS Simulator（不是 macOS 桌面 Safari）----
          opts.set_capability("platformName","ios")
          opts.set_capability("safari:useSimulator", True)
          opts.set_capability("safari:deviceType", "iPhone")
          opts.set_capability("safari:deviceUDID", udid)

          d=None; last=None
          for attempt in range(4):
              try:
                  d=webdriver.Safari(options=opts)
                  break
              except Exception as e:
                  last=e; print("session attempt",attempt,"failed:",str(e)[:300],flush=True); time.sleep(6)
          if d is None:
              raise last

          BASE="http://127.0.0.1:8000/"
          # (name, page, is_iframe) —— 测多个 context 找出真正激活 WebKit 文本放大的环境
          contexts=[
              ("devicewidth","ctx_devicewidth.html",False),
              ("novp",       "ctx_novp.html",       False),
              ("wide",       "ctx_wide.html",       False),
              ("frame",      "ctx_frame.html",      True),
          ]
          try:
              d.set_window_size(390, 844)
              any_repro=False
              for name,page,is_frame in contexts:
                  try:
                      d.switch_to.default_content()
                      d.get(BASE+page)
                      time.sleep(3)
                      if is_frame:
                          d.switch_to.frame(d.find_element("id","kid"))
                          time.sleep(1)
                      res=d.execute_script("return window.__measureAll();")
                  except Exception as e:
                      print("CTX",name,"error:",str(e)[:200],flush=True); continue
                  def h(k):
                      try: return res[k]["rectH"]
                      except: return None
                  a14=h("d_auto14"); b14=h("d_fix14"); n14=h("d_none14")
                  repro = (a14 or 0) > (b14 or 0) + 4
                  any_repro = any_repro or repro
                  print("MEASURE_%s"%name, json.dumps(res, ensure_ascii=False), flush=True)
                  print("VERDICT_%s"%name, json.dumps({
                      "innerW":res.get("innerW"),"docW":res.get("docW"),
                      "A_auto14_rectH":a14,"B_fix14_rectH":b14,"none14_rectH":n14,
                      "auto12_rectH":h("d_auto12"),"fix12_rectH":h("d_fix12"),
                      "nowrap_rectH":h("d_nowrap"),
                      "inflation_reproduced":repro,
                  }, ensure_ascii=False), flush=True)
                  # 全屏截图（iframe context 也截整页，能看到内部放大）
                  d.switch_to.default_content()
                  d.save_screenshot("/tmp/ctx_%s_full.png"%name)
              print("ANY_REPRODUCED", any_repro, flush=True)
          finally:
              try: d.quit()
              except: pass
          PY

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-inflation-ab-shots
          path: /tmp/*.png
          if-no-files-found: warn
